name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type-check, lint, unit tests, build, rules tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The Firestore emulator (rules tests) needs Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - name: Dependency audit
        run: npm run audit:dependencies

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build Cloud Functions bundle
        run: npm run build:functions

      - name: Local resolver fork compatibility
        run: npm run test:resolver

      # Builds in local mode (no Firebase env vars in CI); catches bundling errors.
      - name: Build
        run: npm run build

      - name: Lazy bundle boundaries
        run: npm run check:bundle

      - name: Store transaction integration
        run: npm run test:integration

      - name: Firestore rules tests
        run: npm run test:rules

  browser:
    name: Browser regressions (Chromium and mobile WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck:browser
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - name: Browser report and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
