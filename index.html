<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="96x96" href="/runclub-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a607c" />
    <meta name="description" content="Woodland Woodchuckers Run Club - Run Schedules, Check-ins, and GPX Routes" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      /* Available before the app bundle loads, including offline launches. */
      #launch-splash { display: none; }
      @media (display-mode: standalone), (display-mode: fullscreen) {
        html:has(#launch-splash), body:has(#launch-splash) { background: #1a607c; }
        #launch-splash {
          position: fixed;
          inset: 0;
          z-index: 10000;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
          background: #1a607c;
          opacity: 1;
          transition: opacity 180ms ease-out;
        }
        #launch-splash img { display: block; width: min(100%, 468px); max-height: 75dvh; object-fit: contain; }
        #launch-splash.is-ready { opacity: 0; pointer-events: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        #launch-splash { transition: none; }
      }
    </style>
    <title>Woodland Woodchuckers Run Club</title>
    <!-- Google Fonts: Oswald (Vintage Athletic Display), Outfit (Modern Sport / Run Crew), Plus Jakarta Sans (Clean Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />
    <!-- Leaflet Map CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
  </head>
  <body class="bg-stone-50 text-stone-900 antialiased selection:bg-woodland-500 selection:text-white">
    <div id="launch-splash" role="status" aria-label="Opening Woodland Woodchuckers">
      <img src="/Woodchucker2026-black-cream.png" width="468" height="355" alt="" fetchpriority="high" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
