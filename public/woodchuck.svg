<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="fur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a4c17" />
      <stop offset="100%" stop-color="#5e3418" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a7b9c" />
      <stop offset="100%" stop-color="#1a607c" />
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <circle cx="50" cy="50" r="46" fill="url(#tealGrad)" />
  <circle cx="50" cy="50" r="41" fill="#faf2ee" />
  
  <!-- Ears -->
  <circle cx="34" cy="28" r="9" fill="#5e3418" />
  <circle cx="34" cy="28" r="5" fill="#f5dfa3" />
  <circle cx="66" cy="28" r="9" fill="#5e3418" />
  <circle cx="66" cy="28" r="5" fill="#f5dfa3" />

  <!-- Head / Cheeks -->
  <ellipse cx="50" cy="52" rx="28" ry="24" fill="url(#fur)" />
  <!-- Chubby Cheeks -->
  <circle cx="38" cy="58" r="12" fill="#de9c1e" />
  <circle cx="62" cy="58" r="12" fill="#de9c1e" />

  <!-- Eyes -->
  <circle cx="41" cy="45" r="4" fill="#0d1113" />
  <circle cx="42.5" cy="43.5" r="1.5" fill="#ffffff" />
  <circle cx="59" cy="45" r="4" fill="#0d1113" />
  <circle cx="60.5" cy="43.5" r="1.5" fill="#ffffff" />

  <!-- Nose -->
  <ellipse cx="50" cy="52" rx="5" ry="3.5" fill="#0d1113" />

  <!-- Buck Teeth (Woodchuck style) -->
  <rect x="46.5" y="58" width="3.2" height="6.5" rx="1" fill="#ffffff" stroke="#9ca3af" stroke-width="0.5" />
  <rect x="50.3" y="58" width="3.2" height="6.5" rx="1" fill="#ffffff" stroke="#9ca3af" stroke-width="0.5" />

  <!-- Runner Headband -->
  <path d="M 23 37 Q 50 32 77 37 L 76 43 Q 50 38 24 43 Z" fill="#1a607c" />
  <!-- Runner headband stripe (amber craft beer gold) -->
  <path d="M 23.5 39.5 Q 50 34.5 76.5 39.5" stroke="#f59e0b" stroke-width="2" fill="none" />
</svg>
