<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="fur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <circle cx="50" cy="50" r="46" fill="url(#green)" />
  <circle cx="50" cy="50" r="42" fill="#fdf8ee" />
  
  <!-- Ears -->
  <circle cx="34" cy="28" r="9" fill="#78350f" />
  <circle cx="34" cy="28" r="5" fill="#fbcfe8" />
  <circle cx="66" cy="28" r="9" fill="#78350f" />
  <circle cx="66" cy="28" r="5" fill="#fbcfe8" />

  <!-- Head / Cheeks -->
  <ellipse cx="50" cy="52" rx="28" ry="24" fill="url(#fur)" />
  <!-- Chubby Cheeks -->
  <circle cx="38" cy="58" r="12" fill="#d97706" />
  <circle cx="62" cy="58" r="12" fill="#d97706" />

  <!-- Eyes -->
  <circle cx="41" cy="45" r="4" fill="#1f2937" />
  <circle cx="42.5" cy="43.5" r="1.5" fill="#ffffff" />
  <circle cx="59" cy="45" r="4" fill="#1f2937" />
  <circle cx="60.5" cy="43.5" r="1.5" fill="#ffffff" />

  <!-- Nose -->
  <ellipse cx="50" cy="52" rx="5" ry="3.5" fill="#1f2937" />

  <!-- Buck Teeth (Woodchuck style) -->
  <rect x="46.5" y="58" width="3.2" height="6.5" rx="1" fill="#ffffff" stroke="#9ca3af" stroke-width="0.5" />
  <rect x="50.3" y="58" width="3.2" height="6.5" rx="1" fill="#ffffff" stroke="#9ca3af" stroke-width="0.5" />

  <!-- Runner Headband -->
  <path d="M 23 37 Q 50 32 77 37 L 76 43 Q 50 38 24 43 Z" fill="#22c55e" />
  <!-- Runner headband stripe -->
  <path d="M 23.5 39.5 Q 50 34.5 76.5 39.5" stroke="#facc15" stroke-width="2" fill="none" />
</svg>
